name: Validate

on:
  push:
    branches: [ "sdl" ]
  pull_request:
    branches: [ "sdl" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select changed modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.scope.outputs.build }}
      test: ${{ steps.scope.outputs.test }}
      selection: ${{ steps.scope.outputs.selection }}
      light_checks: ${{ steps.scope.outputs.light_checks }}
      compile: ${{ steps.scope.outputs.compile }}
      modules: ${{ steps.scope.outputs.modules }}
      scripts: ${{ steps.scope.outputs.scripts }}
      layout: ${{ steps.scope.outputs.layout }}
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0
        submodules: true
    - name: Compare source revisions
      id: scope
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        MODULES: changed
      run: |
        python3 -B .github/scripts/app_ci.py --base "$BASE" --modules "$MODULES"

  light-checks:
    name: Run selected CMake checks
    needs: changes
    if: ${{ needs.changes.outputs.light_checks != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: true
    - name: Checkout numerical-isolation sources
      if: ${{ contains(fromJSON(needs.changes.outputs.light_checks), 'ApplicationNumericalIsolation') }}
      run: git submodule update --init --recursive
    - name: Run selected checks
      run: python3 -B Source/NeMo2/.github/scripts/run_cmake_checks.py --checks '${{ needs.changes.outputs.light_checks }}'

  validate:
    needs: changes
    if: ${{ needs.changes.outputs.layout == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Checkout submodules
      run: ./cmake/UpdateSubmodules.ps1



    - name: Check submodule pointers
      run: |
        $status = git submodule status --recursive
        $status
        $bad = $status | Where-Object { $_ -match '^[\+\-U]' }
        if ($bad) {
          Write-Error "Submodule pointers are not clean:`n$($bad -join "`n")"
        }

    - name: Check CMake presets load
      run: |
        $presetFiles = Get-ChildItem -Path . -Filter CMakePresets.json -Recurse |
          Where-Object { $_.FullName -notmatch '\\build\\|\\.build\\|\\.git\\' }

        foreach ($presetFile in $presetFiles) {
          $dir = Split-Path -Parent $presetFile.FullName
          Write-Host "cmake --list-presets in $dir"
          cmake --list-presets -S $dir
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Check application submodule layout
      run: |
        $links = @(git ls-files --stage | Where-Object { $_ -match '^160000 ' } | ForEach-Object { ($_ -split "`t", 2)[1] } | Sort-Object)
        $expected = @('Source/NeMo2', 'Source/Player')
        if (Compare-Object $expected $links) {
          throw "Application must track exactly NeMo2 and Player submodules"
        }
        git -C Source/NeMo2 ls-files --error-unmatch Source/Managers/SdlInputManager Source/Managers/SdlSoundManager
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Check workflow preset references
      run: |
        $rootPresets = Get-Content CMakePresets.json -Raw | ConvertFrom-Json
        $configurePresets = @($rootPresets.configurePresets | ForEach-Object { $_.name })
        $buildPresets = @($rootPresets.buildPresets | ForEach-Object { $_.name })
        $workflowPaths = @(
          ".github/workflows/build.yml",
          ".github/workflows/test.yml",
          ".github/workflows/release.yml"
        ) | Where-Object { Test-Path $_ }

        $configureRefs = @()
        $buildRefs = @()
        foreach ($workflowPath in $workflowPaths) {
          $workflow = Get-Content $workflowPath -Raw
          $configureRefs += [regex]::Matches($workflow, 'configure_preset:\s*([A-Za-z0-9_.-]+)') |
            ForEach-Object { [PSCustomObject]@{ Path = $workflowPath; Name = $_.Groups[1].Value } }
          $buildRefs += [regex]::Matches($workflow, 'build_preset:\s*([A-Za-z0-9_.-]+)') |
            ForEach-Object { [PSCustomObject]@{ Path = $workflowPath; Name = $_.Groups[1].Value } }
        }

        $missing = @()
        foreach ($ref in $configureRefs) {
          if ($configurePresets -notcontains $ref.Name) {
            $missing += "$($ref.Path): missing configure preset: $($ref.Name)"
          }
        }
        foreach ($ref in $buildRefs) {
          if ($buildPresets -notcontains $ref.Name) {
            $missing += "$($ref.Path): missing build preset: $($ref.Name)"
          }
        }
        foreach ($ref in $buildRefs) {
          if ($ref.Name -match '-tests-' -and $ref.Path -ne ".github/workflows/test.yml") {
            $missing += "$($ref.Path): build and release workflows must not reference test build preset: $($ref.Name)"
          }
        }

        if ($missing.Count -gt 0) {
          Write-Error ($missing -join "`n")
        }

        Write-Host "Workflow preset references OK"

  player-sessions:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.scripts), 'player_sessions') }}
    name: Check Windows Player test sessions
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
    - name: Check composition-relative save isolation
      run: python -B -m unittest discover -s .github/scripts -p "test_player_sessions.py"

  scripts:
    name: Check changed CI tools
    needs: changes
    if: ${{ needs.changes.outputs.scripts != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: true
    - name: Check ci
      if: ${{ contains(fromJSON(needs.changes.outputs.scripts), 'ci') }}
      run: python3 -B -m unittest discover -s .github/scripts -p "test_ci_*.py"
    - name: Check release
      if: ${{ contains(fromJSON(needs.changes.outputs.scripts), 'release') }}
      run: python3 -B -m unittest discover -s .github/scripts -p "test_macos_release.py"
    - name: Check player_sessions
      if: ${{ contains(fromJSON(needs.changes.outputs.scripts), 'player_sessions') }}
      run: python3 -B -m unittest discover -s .github/scripts -p "test_player_sessions.py"
