# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-win32
            configure_preset: ballance-runtime-msvc-win32
            build_preset: ballance-runtime-win32-stage-release
            test_dir: build/ballance-runtime-msvc-win32
            artifact_path: build/ballance-runtime-msvc-win32/stage

          - name: runtime-x64
            configure_preset: ballance-runtime-msvc-x64
            build_preset: ballance-runtime-x64-stage-release
            test_dir: build/ballance-runtime-msvc-x64
            artifact_path: build/ballance-runtime-msvc-x64/stage

          - name: static-player-win32
            configure_preset: ballance-static-player-msvc-win32
            build_preset: ballance-static-player-win32-stage-release
            test_dir: build/ballance-static-player-msvc-win32
            artifact_path: build/ballance-static-player-msvc-win32/stage

          - name: static-player-x64
            configure_preset: ballance-static-player-msvc-x64
            build_preset: ballance-static-player-x64-stage-release
            test_dir: build/ballance-static-player-msvc-x64
            artifact_path: build/ballance-static-player-msvc-x64/stage

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test
      run: ctest --test-dir ${{ matrix.test_dir }} -C Release --output-on-failure

    - name: Upload staged runtime
      if: ${{ matrix.artifact_path != '' }}
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ballance-${{ matrix.name }}-${{ github.run_number }}-${{ github.sha }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 14
