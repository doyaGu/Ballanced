name: Build

on:
  # Nightly, and only when sdl has commits the last nightly did not build.
  schedule:
    - cron: "0 19 * * *"
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        type: choice
        default: all
        options:
          - all
          - sdl-linux-x64-full-tests
          - sdl-windows-x86-runtime
          - sdl-windows-x64-runtime
          - sdl-windows-arm64-runtime
          - sdl-linux-x64-runtime
          - sdl-linux-arm64-runtime
          - sdl-macos-x64-runtime
          - sdl-macos-arm64-runtime
          - sdl-windows-x86-static
          - sdl-windows-x64-static
          - sdl-windows-arm64-static
          - sdl-linux-x64-static
          - sdl-linux-arm64-static
          - sdl-macos-x64-static
          - sdl-macos-arm64-static
      gpu-debug:
        description: "Capture GPU validation frames and enable backend diagnostics"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for new commits
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      actions: read

    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
    - name: Compare with the last nightly build
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        built=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --event schedule --limit 30 \
          --json headSha,conclusion --jq 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].headSha // ""')
        echo "changed=$([ "$built" != "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.changes.outputs.changed == 'true') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86
            os: windows-2022
            preset: windows-x86
            archive_ext: .zip
            sdl_discriminator: Windows-X86
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A Win32 --no-warn-unused-cli

          - name: windows-x64
            os: windows-2022
            archive_ext: .zip
            preset: windows-x64
            sdl_discriminator: Windows-X64
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A x64 --no-warn-unused-cli

          - name: windows-arm64
            os: windows-11-arm
            archive_ext: .zip
            preset: windows-arm64
            sdl_discriminator: Windows-ARM64
            # VS 2026's ARM64 optimizer crashes in SIMDe's NEON load path.
            # The image also supplies the supported MSVC 14.44 ARM64 toolset.
            sdl_cmake_generator: Visual Studio 18 2026
            sdl_cmake_arguments: -A ARM64 -T "v143,version=14.44" --no-warn-unused-cli
            configure_arguments: -G "Visual Studio 18 2026" -T "v143,version=14.44"

          - name: linux-x64
            # Mesa 26 fixes fixed-point bilinear rounding on non-x86 CPUs.
            os: ubuntu-26.04
            archive_ext: .tar.gz
            preset: linux-x64
            sdl_discriminator: Linux-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: --no-warn-unused-cli

          - name: linux-arm64
            os: ubuntu-26.04-arm
            archive_ext: .tar.gz
            preset: linux-arm64
            sdl_discriminator: Linux-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: --no-warn-unused-cli

          - name: macos-x64
            # The hosted Intel VM cannot create an SDL Metal device. Build
            # x86_64 binaries and execute them with Rosetta on the ARM VM.
            os: macos-26
            archive_ext: .tar.gz
            preset: macos-x64
            sdl_discriminator: macOS-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 --no-warn-unused-cli
            configure_arguments: -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

          - name: macos-arm64
            os: macos-26
            archive_ext: .tar.gz
            preset: macos-arm64
            sdl_discriminator: macOS-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 --no-warn-unused-cli
            configure_arguments: -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
        linkage:
          - name: runtime
            ballance_build_static: "OFF"

          - name: static
            ballance_build_static: "ON"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1
      GTEST_FAIL_IF_NO_TEST_LINKED: 1
      CKRE_SDL_GPU_DRIVER: ${{ startsWith(matrix.platform.name, 'windows-') && 'direct3d12' || startsWith(matrix.platform.name, 'linux-') && 'vulkan' || 'metal' }}
      CKRE_SDL_GPU_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.gpu-debug) && '1' || '0' }}
      MTL_DEBUG_LAYER: ${{ (github.event_name == 'workflow_dispatch' && inputs.gpu-debug) && '1' || '0' }}

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      uses: actions/checkout@v6.0.2

    - name: Checkout submodules
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: ./cmake/UpdateSubmodules.ps1

    - name: Setup current wayland-scanner
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) && startsWith(matrix.platform.name, 'linux-') }}
      shell: bash
      run: ./cmake/SetupWaylandScanner.sh

    - name: Check x86_64 execution on macOS
      if: ${{ matrix.platform.name == 'macos-x64' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      shell: bash
      run: |
        machine=$(/usr/bin/arch -x86_64 /usr/bin/uname -m)
        echo "Rosetta reports: $machine"
        test "$machine" = x86_64

    - name: Setup SDL3
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      id: sdl
      uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      with:
        version: 3.4.20
        cmake-generator: ${{ matrix.platform.sdl_cmake_generator }}
        cmake-arguments: ${{ matrix.platform.sdl_cmake_arguments }}
        discriminator: ${{ matrix.platform.sdl_discriminator }}
        build-type: Release
        install-linux-dependencies: true

    - name: Configure
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        $diagnosticArguments = @()
        if ($IsWindows -and '${{ inputs.gpu-debug }}' -eq 'true') {
          $diagnosticArguments += '-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi'
          $diagnosticArguments += '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi'
          $diagnosticArguments += '-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF'
          $diagnosticArguments += '-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF'
        }
        cmake --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }} `
          ${{ matrix.platform.configure_arguments }} `
          "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}" `
          -DCKRE_BUILD_TESTS=ON `
          -DVXMATH_BUILD_TESTS=ON -DCK2_BUILD_TESTS=ON `
          -DCKBB_BUILD_TESTS=ON -DCKPLUGINS_BUILD_TESTS=ON `
          -DPLAYER_BUILD_TESTS=ON -DIVP_BUILD_TESTS=ON @diagnosticArguments

    - name: Build
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-stage-release --parallel $([Environment]::ProcessorCount)

    - name: Setup Windows software rasterizer
      if: ${{ startsWith(matrix.platform.name, 'windows-') && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      run: |
        $architecture = '${{ matrix.platform.name }}'.Substring(8)
        ./cmake/SetupWindowsWarp.ps1 -Architecture $architecture -DestinationDirectory "build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/bin/Release"

    - name: Capture GPU validation frames
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu-debug && (startsWith(matrix.platform.name, 'macos-') || startsWith(matrix.platform.name, 'windows-')) && matrix.linkage.name == 'runtime' && (inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      run: |
        $buildRoot = "build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}"
        cmake --build $buildRoot --config Release --target ckre_scene_capture sdl_gpu_ffp_pixel_tests --parallel $([Environment]::ProcessorCount)
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $captureRoot = "$buildRoot/gpu-validation"
        New-Item -ItemType Directory -Force -Path $captureRoot | Out-Null
        $tool = "$buildRoot/bin/ckre_scene_capture"
        $engine = "$buildRoot/lib"
        if ($IsWindows) {
          $tool = "$buildRoot/bin/Release/ckre_scene_capture.exe"
          $engine = "$buildRoot/bin/Release"
          $symbolRoot = New-Item -ItemType Directory -Force -Path "$captureRoot/symbols"
          Get-ChildItem $engine -File | Where-Object { $_.Extension -in '.pdb', '.dll', '.exe' } |
            Copy-Item -Destination $symbolRoot.FullName
        }
        & $tool --render-engine-dir $engine --rasterizer sdlgpu --scene all --frames 5 --capture-frames 1,5 --verbose --out $captureRoot *> "$captureRoot/capture.log"
        $captureExit = $LASTEXITCODE
        if ($captureExit -ne 0) {
          if ($IsWindows) {
            try {
              ./cmake/DebugGpuCapture.ps1 -BinaryDirectory $engine -OutputDirectory "$captureRoot/debugger"
            } catch { Write-Host $_ }
          }
          exit $captureExit
        }
        if ($IsWindows) {
          $env:CKRE_SDL_GPU_FF_JIT_CACHE = '0'
          $env:CKRE_SDL_GPU_FF_JIT_STATS = '1'
          foreach ($mode in @('off', 'fragment', 'on')) {
            $env:CKRE_SDL_GPU_FF_JIT = if ($mode -eq 'off') { '0' } else { '1' }
            $env:CKRE_SDL_GPU_FF_VERTEX_JIT = if ($mode -eq 'fragment') { '0' } else { '1' }
            $modeRoot = "$captureRoot/jit-$mode"
            New-Item -ItemType Directory -Force -Path $modeRoot | Out-Null
            & $tool --render-engine-dir $engine --rasterizer sdlgpu --scene cube_mip_dynamic --frames 120 --frame-delay-ms 16 --capture-frames 1,5,30,60,90,120 --out $modeRoot *> "$modeRoot/capture.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        }
        ctest --test-dir $buildRoot -C Release -R '^sdl_gpu_(ffp|sampler|clipping|readback)_pixel_tests$' --output-on-failure --no-tests=error *> "$captureRoot/fixed-function-pixels.log"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload GPU validation frames
      if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.gpu-debug && (startsWith(matrix.platform.name, 'macos-') || startsWith(matrix.platform.name, 'windows-')) && matrix.linkage.name == 'runtime' && (inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: gpu-validation-${{ matrix.platform.name }}
        path: build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/gpu-validation/
        if-no-files-found: error

    - name: Build tests
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-release --parallel $([Environment]::ProcessorCount)

    - name: Install Linux Vulkan test dependencies
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) && startsWith(matrix.platform.name, 'linux-') }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libgles2 libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers
        mesa_version=$(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)
        echo "Mesa Vulkan driver: $mesa_version (requires fixed-point rounding from Mesa 26)"
        dpkg --compare-versions "$mesa_version" ge 26.0.0

    - name: Test complete suite
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        if ($IsLinux) {
          xvfb-run -a ctest --test-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }} -C Release --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml"
        } else {
          ctest --test-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }} -C Release --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml"
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify executed tests
      if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      run: python3 -B .github/scripts/verify_ctest_results.py "build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml"

    - name: Upload test results
      if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-results-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
        path: |
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/Testing/Temporary/
        if-no-files-found: error

    - name: Upload failed test output
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-output-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
        path: |
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/Testing/Temporary/
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/scene_capture*/
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/**/ffjit-failures/
        if-no-files-found: ignore

    - name: Create package
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        cmake "-DSTAGE_ROOT:PATH=build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/stage" "-DARCHIVE_PATH:PATH=$archive" -P cmake/PackageStage.cmake

    - name: Verify package
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        $extractRoot = Join-Path $env:RUNNER_TEMP "package-$target"
        $componentManifest = Join-Path $env:GITHUB_WORKSPACE "build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/RuntimeComponents.cmake"
        cmake "-DARCHIVE_PATH:PATH=$archive" "-DEXTRACT_ROOT:PATH=$extractRoot" "-DBALLANCE_COMPONENT_MANIFEST:FILEPATH=$componentManifest" "-DBALLANCE_BUILD_STATIC:BOOL=${{ matrix.linkage.ballance_build_static }}" -P cmake/VerifyReleaseArchive.cmake

    - name: Upload package
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        path: dist/ballance-sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}${{ matrix.platform.archive_ext }}
        archive: false
        if-no-files-found: error
        retention-days: 14

  full-tests:
    name: sdl-linux-x64-full-tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.changes.outputs.changed == 'true') && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'sdl-linux-x64-full-tests') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1
      GTEST_FAIL_IF_NO_TEST_LINKED: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Checkout submodules
      shell: pwsh
      run: ./cmake/UpdateSubmodules.ps1

    - name: Setup current wayland-scanner
      run: ./cmake/SetupWaylandScanner.sh

    - name: Setup SDL3
      id: sdl
      uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      with:
        version: 3.4.20
        build-type: Release
        cmake-arguments: --no-warn-unused-cli
        install-linux-dependencies: true

    - name: Configure full test suite
      shell: pwsh
      run: cmake --preset linux-x64-tests "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}" -DBALLANCE_AUTO_DETECT_ASSETS=OFF -DBALLANCE_ASSETS_ROOT= -DPLAYER_BUILD_TESTS=ON -DIVP_BUILD_TESTS=ON

    - name: Build full test suite
      run: cmake --build --preset linux-x64-tests-release

    - name: Install Linux Vulkan test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb mesa-vulkan-drivers
        mesa_version=$(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)
        echo "Mesa Vulkan driver: $mesa_version (requires fixed-point rounding from Mesa 26)"
        dpkg --compare-versions "$mesa_version" ge 26.0.0

    - name: Run full test suite
      env:
        SDL_VIDEODRIVER: x11
        CKRE_SDL_GPU_DRIVER: vulkan
      run: xvfb-run -a ctest --preset linux-x64-tests-release --no-tests=error --output-junit "${{ github.workspace }}/build/linux-x64-tests/ctest-results.xml"

    - name: Verify executed tests
      if: ${{ !cancelled() }}
      run: python3 -B .github/scripts/verify_ctest_results.py build/linux-x64-tests/ctest-results.xml

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-results-linux-x64-full-tests
        path: |
          build/linux-x64-tests/ctest-results.xml
          build/linux-x64-tests/Testing/Temporary/
        if-no-files-found: error

    - name: Upload failed test output
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-output-linux-x64-full-tests
        path: |
          build/linux-x64-tests/ctest-results.xml
          build/linux-x64-tests/Testing/Temporary/
          build/linux-x64-tests/scene_capture*/
          build/linux-x64-tests/**/ffjit-failures/
        if-no-files-found: ignore
