# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        type: choice
        default: all
        options:
          - all
          - runtime-win32
          - runtime-x64
          - runtime-arm64
          - static-win32
          - static-x64
          - static-arm64

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-win32
            configure_preset: windows-x86-runtime
            build_preset: windows-x86-runtime-stage-release
            test_dir: build/windows-x86-runtime
            artifact_path: build/windows-x86-runtime/stage

          - name: runtime-x64
            configure_preset: windows-x64-runtime
            build_preset: windows-x64-runtime-stage-release
            test_dir: build/windows-x64-runtime
            artifact_path: build/windows-x64-runtime/stage

          - name: runtime-arm64
            configure_preset: windows-arm64-runtime
            build_preset: windows-arm64-runtime-stage-release
            test_dir: build/windows-arm64-runtime
            artifact_path: build/windows-arm64-runtime/stage

          - name: static-win32
            configure_preset: windows-x86-static
            build_preset: windows-x86-static-stage-release
            test_dir: build/windows-x86-static
            artifact_path: build/windows-x86-static/stage

          - name: static-x64
            configure_preset: windows-x64-static
            build_preset: windows-x64-static-stage-release
            test_dir: build/windows-x64-static
            artifact_path: build/windows-x64-static/stage

          - name: static-arm64
            configure_preset: windows-arm64-static
            build_preset: windows-arm64-static-stage-release
            test_dir: build/windows-arm64-static
            artifact_path: build/windows-arm64-static/stage

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Configure
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      run: cmake --preset ${{ matrix.configure_preset }}

    - name: Build
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      run: ctest --test-dir ${{ matrix.test_dir }} -C Release --output-on-failure

    - name: Upload staged runtime
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name) && matrix.artifact_path != '' }}
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ballance-${{ matrix.name }}-${{ github.run_number }}-${{ github.sha }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 14
