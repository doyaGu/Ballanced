name: Build

on:
  push:
    branches: [ "sdl" ]
  pull_request:
    branches: [ "sdl" ]
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        type: choice
        default: all
        options:
          - all
          - sdl-windows-x86-runtime
          - sdl-windows-x64-runtime
          - sdl-windows-arm64-runtime
          - sdl-linux-x64-runtime
          - sdl-linux-arm64-runtime
          - sdl-macos-x64-runtime
          - sdl-macos-arm64-runtime
          - sdl-windows-x86-static
          - sdl-windows-x64-static
          - sdl-windows-arm64-static
          - sdl-linux-x64-static
          - sdl-linux-arm64-static
          - sdl-macos-x64-static
          - sdl-macos-arm64-static

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86
            os: windows-2022
            preset: windows-x86
            archive_ext: .zip
            sdl_discriminator: Windows-X86
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A Win32

          - name: windows-x64
            os: windows-2022
            archive_ext: .zip
            preset: windows-x64
            sdl_discriminator: Windows-X64
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A x64

          - name: windows-arm64
            os: windows-11-arm
            archive_ext: .zip
            preset: windows-arm64
            sdl_discriminator: Windows-ARM64
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A ARM64

          - name: linux-x64
            os: ubuntu-24.04
            archive_ext: .tar.gz
            preset: linux-x64
            sdl_discriminator: Linux-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: ""

          - name: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: .tar.gz
            preset: linux-arm64
            sdl_discriminator: Linux-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: ""

          - name: macos-x64
            os: macos-15-intel
            archive_ext: .tar.gz
            preset: macos-x64
            sdl_discriminator: macOS-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64

          - name: macos-arm64
            os: macos-15
            archive_ext: .tar.gz
            preset: macos-arm64
            sdl_discriminator: macOS-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=arm64
        linkage:
          - name: runtime
            ballance_build_static: "OFF"

          - name: static
            ballance_build_static: "ON"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Setup SDL3
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        cmake-generator: ${{ matrix.platform.sdl_cmake_generator }}
        cmake-arguments: ${{ matrix.platform.sdl_cmake_arguments }}
        discriminator: ${{ matrix.platform.sdl_discriminator }}
        install-linux-dependencies: true

    - name: Configure
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: cmake --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }} "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}"

    - name: Build
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-stage-release

    - name: Test
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: ctest --test-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }} -C Release --output-on-failure

    - name: Create package
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        cmake "-DSTAGE_ROOT:PATH=build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/stage" "-DARCHIVE_PATH:PATH=$archive" -P cmake/PackageStage.cmake

    - name: Verify package
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        $extractRoot = Join-Path $env:RUNNER_TEMP "package-$target"
        cmake "-DARCHIVE_PATH:PATH=$archive" "-DEXTRACT_ROOT:PATH=$extractRoot" "-DBALLANCE_BUILD_STATIC:BOOL=${{ matrix.linkage.ballance_build_static }}" -P cmake/VerifyReleaseArchive.cmake

    - name: Upload package
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        path: dist/ballance-sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}${{ matrix.platform.archive_ext }}
        archive: false
        if-no-files-found: error
        retention-days: 14
