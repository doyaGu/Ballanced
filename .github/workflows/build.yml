name: Build

on:
  push:
    branches: [ "sdl" ]
  pull_request:
    branches: [ "sdl" ]
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        type: choice
        default: all
        options:
          - all
          - sdl-windows-x64
          - sdl-linux-x64

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdl-windows-x64
            os: windows-2022
            configure_preset: windows-x64-runtime
            build_preset: windows-x64-runtime-stage-release
            test_dir: build/windows-x64-runtime
            artifact_path: build/windows-x64-runtime/stage

          - name: sdl-linux-x64
            os: ubuntu-24.04
            configure_preset: linux-x64-runtime
            build_preset: linux-x64-runtime-stage-release
            test_dir: build/linux-x64-runtime
            artifact_path: build/linux-x64-runtime/stage

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Setup SDL3
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        install-linux-dependencies: true

    - name: Configure
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      run: cmake --preset ${{ matrix.configure_preset }} "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}"

    - name: Build
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
      run: ctest --test-dir ${{ matrix.test_dir }} -C Release --output-on-failure

    - name: Upload staged runtime
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name) && matrix.artifact_path != '' }}
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ballance-${{ matrix.name }}-${{ github.run_number }}-${{ github.sha }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 14
