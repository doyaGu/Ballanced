name: GPU replay diagnostics

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Test run containing GPU validation binaries and symbols
        required: true
        type: string
      platform:
        description: GPU test platform
        required: true
        type: choice
        options: [windows-arm64, windows-x64, windows-x86, macos-arm64, macos-x64]
      first-chance:
        description: Capture the first access violation before application exception handlers run
        type: boolean
        default: false
      scene:
        description: Scene to replay under the Windows debugger
        type: string
        default: opaque_lit
      trace-present:
        description: Trace DXGI presentation return values
        type: boolean
        default: false
      frames:
        description: Number of frames to replay under the Windows debugger
        type: number
        default: 5
      validation:
        description: Enable GPU API and shader validation layers
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ${{ startsWith(inputs.platform, 'macos-') && 'macos-26' || inputs.platform == 'windows-arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 30
    env:
      CKRE_SDL_GPU_DRIVER: ${{ startsWith(inputs.platform, 'macos-') && 'metal' || 'direct3d12' }}
      CKRE_SDL_GPU_DEBUG: ${{ inputs.validation && '1' || '0' }}
      MTL_DEBUG_LAYER: ${{ inputs.validation && '1' || '0' }}
      MTL_SHADER_VALIDATION: ${{ inputs.validation && '1' || '0' }}
      MTL_SHADER_VALIDATION_REPORT_TO_STDERR: '1'
      CAPTURE_FIRST_CHANCE: ${{ inputs.first-chance }}
      CAPTURE_SCENE: ${{ inputs.scene }}
      CAPTURE_TRACE_PRESENT: ${{ inputs.trace-present }}
      CAPTURE_FRAMES: ${{ inputs.frames }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v8
        with:
          name: gpu-validation-${{ inputs.platform }}
          path: build/gpu-validation
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Setup current Windows software rasterizer
        if: ${{ startsWith(inputs.platform, 'windows-') }}
        shell: pwsh
        env:
          CAPTURE_PLATFORM: ${{ inputs.platform }}
        run: ./cmake/SetupWindowsWarp.ps1 -Architecture $env:CAPTURE_PLATFORM.Substring(8) -DestinationDirectory build/gpu-validation/symbols
      - name: Compare Direct3D runtime device creation
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/gpu-crash | Out-Null
          $architecture = '${{ inputs.platform }}'.Substring(8)
          $visualStudio = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          $compilerArchitecture = $architecture -eq 'x64' ? 'amd64' : $architecture
          $compilerHost = $architecture -eq 'arm64' ? 'arm64' : 'amd64'
          & "$visualStudio/Common7/Tools/Launch-VsDevShell.ps1" -Arch $compilerArchitecture -HostArch $compilerHost -SkipAutomaticLocation
          $binary = (Resolve-Path build/gpu-validation/symbols).Path
          ./cmake/SetupWindowsD3D12.ps1 -Architecture $architecture -DestinationDirectory "$binary/D3D12"
          cl /nologo /EHsc /O2 cmake/ProbeD3D12Runtime.cpp "/Fo$binary/probe-system.obj" "/Fe$binary/probe-system.exe" d3d12.lib dxgi.lib user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /O2 /DPROBE_D3D12_SDK_VERSION=620 cmake/ProbeD3D12Runtime.cpp "/Fo$binary/probe-agility.obj" "/Fe$binary/probe-agility.exe" d3d12.lib dxgi.lib user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdlSource = Join-Path $env:RUNNER_TEMP 'SDL-presentation-probe'
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git $sdlSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /O2 "/I$sdlSource/include" cmake/ProbeSdlGpuPresent.cpp "/Fo$binary/probe-sdl.obj" "/Fe$binary/probe-sdl.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /O2 /DPROBE_SDL_WINDOW /DPROBE_D3D12_SDK_VERSION=620 "/I$sdlSource/include" cmake/ProbeD3D12Runtime.cpp "/Fo$binary/probe-sdl-window.obj" "/Fe$binary/probe-sdl-window.exe" d3d12.lib dxgi.lib user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = $false
          # The virtual display adapter is a negative control. The explicitly
          # selected WARP device must pass every validation mode below.
          function Test-DefaultAdapterResult([string]$log, [int]$code) {
            if ($code -eq 0) { return $true }
            $output = Get-Content -LiteralPath $log -Raw
            return $code -eq 5 -and $output -match '(?m)^SDL present mode=\d+ submit:'
          }
          logman start BallancedNativePresent -p Microsoft-Windows-DXGI 0xffffffffffffffff -o build/gpu-crash/d3d12-native-present.etl -ets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($runtime in @('system', 'agility')) { foreach ($fence in @(0, 1, 2)) {
            & "$binary/probe-$runtime.exe" 0 32 $fence *> "build/gpu-crash/d3d12-$runtime-fence-$fence-0.log"
            Write-Host "$runtime fence=$fence debug=0 exit=$LASTEXITCODE"
            if ($runtime -eq 'agility' -and $LASTEXITCODE -ne 0) { $failed = $true }
          } }
          foreach ($mode in @(0, 1, 2, 3, 4, 5)) {
            & "$binary/probe-sdl.exe" "$binary/SDL3.dll" $mode 0 *> "build/gpu-crash/d3d12-sdl-$mode-0.log"
            Write-Host "Default adapter SDL mode=$mode exit=$LASTEXITCODE"
            if (-not (Test-DefaultAdapterResult "build/gpu-crash/d3d12-sdl-$mode-0.log" $LASTEXITCODE)) { $failed = $true }
            & "$binary/probe-sdl.exe" "$binary/SDL3.dll" $mode 0 1 *> "build/gpu-crash/d3d12-factory-sdl-$mode-0.log"
            Write-Host "Default adapter SDK factory mode=$mode exit=$LASTEXITCODE"
            if (-not (Test-DefaultAdapterResult "build/gpu-crash/d3d12-factory-sdl-$mode-0.log" $LASTEXITCODE)) { $failed = $true }
          }
          foreach ($clear in @(0, 1)) { foreach ($tearing in @(0, 1)) { foreach ($recreate in @(0, 1)) {
            & "$binary/probe-agility.exe" 0 32 2 $clear $tearing $recreate *> "build/gpu-crash/d3d12-work-$clear-$tearing-$recreate.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            & "$binary/probe-sdl-window.exe" 0 32 2 $clear $tearing $recreate "$binary/SDL3.dll" *> "build/gpu-crash/d3d12-sdl-window-$clear-$tearing-$recreate.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } } }
          foreach ($preference in @(0, 1)) { foreach ($association in @(0, 1)) {
            & "$binary/probe-sdl-window.exe" 0 32 2 1 1 0 "$binary/SDL3.dll" $preference $association *> "build/gpu-crash/d3d12-adapter-$preference-$association.log"
            Write-Host "Native adapter preference=$preference association=$association exit=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) {
              $output = Get-Content -LiteralPath "build/gpu-crash/d3d12-adapter-$preference-$association.log" -Raw
              if ($preference -eq 0 -or $LASTEXITCODE -ne 5 -or $output -notmatch 'Present window=\d+ frame=\d+: 0x80070057') {
                $failed = $true
              }
            }
          } }
          logman stop BallancedNativePresent -ets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tracerpt build/gpu-crash/d3d12-native-present.etl -o build/gpu-crash/d3d12-native-present.xml -of XML -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($failed) { throw 'Native presentation probes failed; see d3d12 logs' }
      - name: Upload Direct3D runtime comparison
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: d3d12-runtime-${{ inputs.platform }}
          path: |
            build/gpu-crash/d3d12-*.log
            build/gpu-crash/d3d12-native-present.xml
          if-no-files-found: error
      - name: Compare explicitly selected WARP presentation
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        shell: pwsh
        run: |
          $binary = (Resolve-Path build/gpu-validation/symbols).Path
          $config = "$binary/D3D12/d3dconfig.exe"
          $tool = Join-Path $binary 'probe-sdl.exe'
          & $config apps --add $tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & $config device force-warp=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $failed = $false
            foreach ($mode in @(0, 1, 2, 3, 4, 5)) {
              & $tool "$binary/SDL3.dll" $mode 0 *> "build/gpu-crash/d3d12-warp-selected-$mode.log"
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
            if ($failed) { throw 'Explicit WARP SDL presentation failed' }
          } finally {
            & $config device force-warp=false
            & $config apps --remove $tool
          }
          foreach ($name in @('probe-sdl', 'ckre_scene_capture', 'sdl_gpu_ffp_pixel_tests')) {
            & $config apps --add (Join-Path $binary "$name.exe")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $config device force-warp=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload explicitly selected WARP logs
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: d3d12-warp-selected-${{ inputs.platform }}
          path: build/gpu-crash/d3d12-warp-selected-*.log
          if-no-files-found: error
      - name: Verify native Direct3D debug layers
        if: ${{ !cancelled() && inputs.validation && startsWith(inputs.platform, 'windows-') }}
        timeout-minutes: 12
        shell: pwsh
        run: |
          $binary = (Resolve-Path build/gpu-validation/symbols).Path
          & "$binary/probe-agility.exe" 1 32 *> build/gpu-crash/d3d12-agility-1.log
          $failed = $LASTEXITCODE -ne 0
          foreach ($mode in @(0, 1, 2, 3, 4, 5)) {
            & "$binary/probe-sdl.exe" "$binary/SDL3.dll" $mode 1 *> "build/gpu-crash/d3d12-sdl-$mode-1.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Debug-layer presentation probes failed; see d3d12 logs' }
      - name: Upload Direct3D validation logs
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: d3d12-validation-${{ inputs.platform }}
          path: build/gpu-crash/*.log
          if-no-files-found: error
      - name: Capture the access violation with CDB
        id: debugger
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        shell: pwsh
        run: ./cmake/DebugGpuCapture.ps1 -BinaryDirectory build/gpu-validation/symbols -OutputDirectory build/gpu-crash -Scene $env:CAPTURE_SCENE -Frames $env:CAPTURE_FRAMES -TracePresent:($env:CAPTURE_TRACE_PRESENT -eq 'true') -FirstChance:($env:CAPTURE_FIRST_CHANCE -eq 'true')
      - name: Verify Metal sampler clipping and readback pixels
        if: ${{ startsWith(inputs.platform, 'macos-') }}
        shell: pwsh
        run: |
          $env:DYLD_LIBRARY_PATH = (Resolve-Path build/gpu-validation/runtime/Bin).Path
          $tool = (Resolve-Path build/gpu-validation/runtime/Bin/sdl_gpu_ffp_pixel_tests).Path
          chmod +x $tool
          New-Item -ItemType Directory -Force build/gpu-crash | Out-Null
          $failed = $false
          foreach ($case in @('samplers', 'clipping', 'readbacks')) {
            & $tool "--$case" *> "build/gpu-crash/$case.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Verify Windows GPU pixels
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') }}
        shell: pwsh
        run: |
          $tool = (Resolve-Path build/gpu-validation/symbols/sdl_gpu_ffp_pixel_tests.exe).Path
          $failed = $false
          foreach ($case in @('ffp', 'samplers', 'clipping', 'readbacks')) {
            $arguments = $case -eq 'ffp' ? @() : @("--$case")
            & $tool @arguments *> "build/gpu-crash/windows-$case.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Collect Metal command errors
        if: ${{ !cancelled() && startsWith(inputs.platform, 'macos-') }}
        shell: pwsh
        run: |
          sudo /usr/bin/log show --last 10m --style compact `
            --predicate 'process == "sdl_gpu_ffp_pixel_tests" OR eventMessage CONTAINS[c] "GPU"' `
            *> build/gpu-crash/metal-system.log
      - name: Inspect failed Metal command buffers
        if: ${{ failure() && startsWith(inputs.platform, 'macos-') }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $tool = (Resolve-Path build/gpu-validation/runtime/Bin/sdl_gpu_ffp_pixel_tests).Path
          $libraries = (Resolve-Path build/gpu-validation/runtime/Bin).Path
          # Reproduce the ordinary CTest workload after preserving the shader
          # instrumentation diagnostics above.
          $env:MTL_SHADER_VALIDATION = '0'
          xcrun lldb --batch -o "settings set target.env-vars DYLD_LIBRARY_PATH=$libraries MTL_SHADER_VALIDATION=0" `
            -o "command script import $PWD/cmake/TraceMetalGpu.py" -o run `
            -- $tool --samplers *> build/gpu-crash/metal-debugger.log
          $log = Get-Content -LiteralPath build/gpu-crash/metal-debugger.log -Raw
          if ($log -notmatch 'Process \d+ exited with status' -or
              $log -notmatch 'Running test: wide sampler layouts' -or
              $log -match 'inspection failed:') {
            throw 'LLDB did not inspect a completed Metal sampler test; see metal-debugger.log'
          }
      - name: Probe native Metal cube sampler layouts
        if: ${{ !cancelled() && startsWith(inputs.platform, 'macos-') }}
        shell: pwsh
        run: |
          xcrun clang++ -fobjc-arc -framework Foundation -framework Metal cmake/ProbeMetalSamplers.mm -o build/gpu-crash/metal-samplers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MTL_DEBUG_LAYER = '0'
          $env:MTL_SHADER_VALIDATION = '0'
          $failed = $false
          foreach ($cubes in @(4, 8)) {
            foreach ($sampled in @(1, 4, 5, 8) | Where-Object { $_ -le $cubes }) {
              foreach ($mixed in @(0, 1)) { foreach ($alias in @(0, 1)) {
                & build/gpu-crash/metal-samplers $cubes $sampled $mixed $alias *> "build/gpu-crash/metal-native-$cubes-$sampled-$mixed-$alias.log"
                if ($LASTEXITCODE -ne 0) { $failed = $true }
              } }
            }
          }
          git submodule update --init --depth 1 Source/RenderEngine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B cmake/PrepareMetalSamplerProbe.py build/gpu-crash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('fs_ff_stage', 'fs_ff_stage_native', 'fs_ff_stage_cube', 'fs_ff_stage_cube_native')) {
            $cubes = $name.Contains('_cube') ? 8 : 4
            foreach ($sampled in @(1, 4, 5, 8) | Where-Object { $_ -le $cubes }) {
              & build/gpu-crash/metal-samplers $cubes $sampled 1 1 "build/gpu-crash/$name.metal" *> "build/gpu-crash/metal-ffp-$name-$sampled.log"
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          }
          if ($failed) { exit 1 }
      - name: Upload GPU inspection logs
        if: ${{ !cancelled() && startsWith(inputs.platform, 'macos-') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gpu-inspection-${{ inputs.platform }}
          path: build/gpu-crash/*.log
          if-no-files-found: error
      - name: Start DXGI presentation events
        id: present-events
        if: ${{ !cancelled() && startsWith(inputs.platform, 'windows-') && steps.debugger.outcome == 'success' }}
        shell: pwsh
        run: logman start BallancedGpuPresent -p Microsoft-Windows-DXGI 0xffffffffffffffff -o build/gpu-crash/dxgi-present.etl -ets
      - name: Verify scene images
        if: ${{ !cancelled() && (startsWith(inputs.platform, 'macos-') || steps.debugger.outcome == 'success') }}
        shell: pwsh
        run: |
          git submodule update --init --depth 1 Source/RenderEngine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsMacOS) {
            $engine = (Resolve-Path build/gpu-validation/runtime/RenderEngines).Path
            $env:DYLD_LIBRARY_PATH = (Resolve-Path build/gpu-validation/runtime/Bin).Path
            $tool = (Resolve-Path build/gpu-validation/runtime/Bin/ckre_scene_capture).Path
            chmod +x $tool
          } else {
            $engine = (Resolve-Path build/gpu-validation/symbols).Path
            $tool = Join-Path $engine 'ckre_scene_capture.exe'
          }
          cmake "-DTOOL=$tool" "-DENGINE_DIR=$engine" `
            "-DGOLDEN_ROOT=$PWD/Source/RenderEngine/tests/reference/frames/golden" `
            "-DOUT_DIR=$PWD/build/gpu-crash/scenes" -P Source/RenderEngine/tests/scene_capture_golden.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect DXGI presentation events
        if: ${{ !cancelled() && steps.present-events.outcome == 'success' }}
        shell: pwsh
        run: |
          logman stop BallancedGpuPresent -ets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tracerpt build/gpu-crash/dxgi-present.etl -o build/gpu-crash/dxgi-present.xml -of XML -y
      - name: Verify JIT replay
        if: ${{ !cancelled() && steps.debugger.outcome == 'success' }}
        shell: pwsh
        run: |
          $engine = (Resolve-Path build/gpu-validation/symbols).Path
          $tool = Join-Path $engine 'ckre_scene_capture.exe'
          python Source/RenderEngine/tests/scene_capture_jit.py --tool $tool --engine-dir $engine `
            --out build/gpu-crash/jit --drivers direct3d12 --scenes cube_filter_dynamic,cube_mip_dynamic,rtt_cube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload crash diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gpu-crash-${{ inputs.platform }}
          path: build/gpu-crash/
          if-no-files-found: error
