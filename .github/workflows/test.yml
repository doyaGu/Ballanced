name: Test

on:
  # Nightly Build calls this workflow after saving its incremental caches.
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: "Test target"
        required: false
        type: choice
        default: all
        options:
          - all
          - sdl-windows-x86-runtime
          - sdl-windows-x64-runtime
          - sdl-windows-arm64-runtime
          - sdl-linux-x64-runtime
          - sdl-linux-arm64-runtime
          - sdl-macos-x64-runtime
          - sdl-macos-arm64-runtime
          - sdl-windows-x86-static
          - sdl-windows-x64-static
          - sdl-windows-arm64-static
          - sdl-linux-x64-static
          - sdl-linux-arm64-static
          - sdl-macos-x64-static
          - sdl-macos-arm64-static

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  test:
    name: sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86
            os: windows-2022
            preset: windows-x86
            sdl_discriminator: Windows-X86
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A Win32 --no-warn-unused-cli

          - name: windows-x64
            os: windows-2022
            preset: windows-x64
            sdl_discriminator: Windows-X64
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A x64 --no-warn-unused-cli

          - name: windows-arm64
            os: windows-11-arm
            preset: windows-arm64
            sdl_discriminator: Windows-ARM64
            # VS 2026's ARM64 optimizer crashes in SIMDe's NEON load path.
            # The image also supplies the supported MSVC 14.44 ARM64 toolset.
            sdl_cmake_generator: Visual Studio 18 2026
            sdl_cmake_arguments: -A ARM64 -T "v143,version=14.44" --no-warn-unused-cli
            configure_arguments: -G "Visual Studio 18 2026" -T "v143,version=14.44"

          - name: linux-x64
            # Mesa 26 fixes fixed-point bilinear rounding on non-x86 CPUs.
            os: ubuntu-26.04
            preset: linux-x64
            sdl_discriminator: Linux-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: --no-warn-unused-cli

          - name: linux-arm64
            os: ubuntu-26.04-arm
            preset: linux-arm64
            sdl_discriminator: Linux-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: --no-warn-unused-cli

          - name: macos-x64
            # The hosted Intel VM cannot create an SDL Metal device. Build
            # x86_64 binaries and execute them with Rosetta on the ARM VM.
            os: macos-26
            preset: macos-x64
            sdl_discriminator: macOS-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 --no-warn-unused-cli
            configure_arguments: '"-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0"'

          - name: macos-arm64
            os: macos-26
            preset: macos-arm64
            sdl_discriminator: macOS-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 --no-warn-unused-cli
            configure_arguments: '"-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0"'
        linkage:
          - name: runtime

          - name: static

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1
      GTEST_FAIL_IF_NO_TEST_LINKED: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      uses: actions/checkout@v6.0.2

    - name: Checkout submodules
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: ./cmake/UpdateSubmodules.ps1

    - name: Setup current wayland-scanner
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) && startsWith(matrix.platform.name, 'linux-') }}
      shell: bash
      run: ./Source/NeMo2/cmake/SetupWaylandScanner.sh

    - name: Check x86_64 execution on macOS
      if: ${{ matrix.platform.name == 'macos-x64' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      shell: bash
      run: |
        machine=$(/usr/bin/arch -x86_64 /usr/bin/uname -m)
        echo "Rosetta reports: $machine"
        test "$machine" = x86_64

    - name: Setup SDL3
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      id: sdl
      uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      with:
        version: 3.4.20
        cmake-generator: ${{ matrix.platform.sdl_cmake_generator }}
        cmake-arguments: ${{ matrix.platform.sdl_cmake_arguments }}
        discriminator: ${{ matrix.platform.sdl_discriminator }}
        build-type: Release
        install-linux-dependencies: true

    - name: Prepare build cache key
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      id: cache-key
      run: |
        $imageVersion = $env:ImageVersion
        "prefix=ballance-build-v3-${{ matrix.platform.name }}-${{ matrix.linkage.name }}-${imageVersion}-sdl3.4.20-${{ hashFiles('CMakePresets.json', 'cmake/BallanceCompiler.cmake', 'cmake/BallanceLinkCache.cmake', 'Source/NeMo2/cmake/NeMo2Compiler.cmake', 'Source/NeMo2/cmake/NeMo2LinkCache.cmake') }}-" >> $env:GITHUB_OUTPUT
        "legacy-test=test-v2-nemo-${{ matrix.platform.name }}-${{ matrix.linkage.name }}-${imageVersion}-" >> $env:GITHUB_OUTPUT
        "legacy-build=build-v2-nemo-${{ matrix.platform.name }}-${{ matrix.linkage.name }}-${imageVersion}-" >> $env:GITHUB_OUTPUT

    - name: Restore incremental build
      if: ${{ steps.cache-key.outcome == 'success' }}
      id: build-cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}
        key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}-test
        restore-keys: |
          ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}-
          ${{ steps.cache-key.outputs.prefix }}
          ${{ steps.cache-key.outputs.legacy-test }}
          ${{ steps.cache-key.outputs.legacy-build }}

    - name: Restore unchanged source timestamps
      if: ${{ steps.cache-key.outcome == 'success' }}
      run: python3 -B Source/NeMo2/.github/scripts/build_cache_state.py restore --build-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}

    - name: Configure
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        cmake --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }} `
          ${{ matrix.platform.configure_arguments }} `
          "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}" `
          -DBUILD_TESTING=ON -DPLAYER_BUILD_TESTS=ON `
          -DBALLANCE_AUTO_DETECT_ASSETS=OFF -DBALLANCE_ASSETS_ROOT=

    - name: Build staged runtime
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-stage-release --parallel $([Environment]::ProcessorCount)

    - name: Build tests
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-release --parallel $([Environment]::ProcessorCount)

    - name: Save source timestamps for incremental builds
      if: ${{ !cancelled() && steps.cache-key.outcome == 'success' }}
      run: python3 -B Source/NeMo2/.github/scripts/build_cache_state.py save --build-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}

    - name: Save incremental build
      if: ${{ !cancelled() && steps.cache-key.outcome == 'success' && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    - name: Test complete suite
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: ctest --test-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }} -C Release --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml"

    - name: Verify executed tests
      if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      run: python3 -B Source/NeMo2/.github/scripts/verify_ctest_results.py "build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml"

    - name: Upload test results
      if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-results-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
        path: |
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/Testing/Temporary/
        if-no-files-found: error

    - name: Upload failed test output
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-output-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
        path: |
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/ctest-results.xml
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/Testing/Temporary/
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/scene_capture*/
          build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/**/ffjit-failures/
        if-no-files-found: ignore
