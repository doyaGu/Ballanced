name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: windows-latest
    timeout-minutes: 10

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Create or update draft release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"

        gh release view $tag *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag --title $tag --draft --generate-notes
        }

  package:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 120

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-win32
            configure_preset: windows-x86-runtime
            build_preset: windows-x86-runtime-stage-release
            test_dir: build/windows-x86-runtime
            stage_path: build/windows-x86-runtime/stage
            ballance_build_static: "OFF"

          - name: runtime-x64
            configure_preset: windows-x64-runtime
            build_preset: windows-x64-runtime-stage-release
            test_dir: build/windows-x64-runtime
            stage_path: build/windows-x64-runtime/stage
            ballance_build_static: "OFF"

          - name: runtime-arm64
            configure_preset: windows-arm64-runtime
            build_preset: windows-arm64-runtime-stage-release
            test_dir: build/windows-arm64-runtime
            stage_path: build/windows-arm64-runtime/stage
            ballance_build_static: "OFF"

          - name: static-win32
            configure_preset: windows-x86-static
            build_preset: windows-x86-static-stage-release
            test_dir: build/windows-x86-static
            stage_path: build/windows-x86-static/stage
            ballance_build_static: "ON"

          - name: static-x64
            configure_preset: windows-x64-static
            build_preset: windows-x64-static-stage-release
            test_dir: build/windows-x64-static
            stage_path: build/windows-x64-static/stage
            ballance_build_static: "ON"

          - name: static-arm64
            configure_preset: windows-arm64-static
            build_preset: windows-arm64-static-stage-release
            test_dir: build/windows-arm64-static
            stage_path: build/windows-arm64-static/stage
            ballance_build_static: "ON"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }} -DBALLANCE_AUTO_DETECT_ASSETS=OFF -DBALLANCE_ASSETS_ROOT=

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test staged layout
      run: ctest --test-dir ${{ matrix.test_dir }} -C Release --output-on-failure

    - name: Create release archive
      run: |
        $stage = (Resolve-Path "${{ matrix.stage_path }}").Path
        $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
        New-Item -ItemType Directory -Force $dist | Out-Null

        $archive = Join-Path $dist "ballance-${{ matrix.name }}.zip"
        if (Test-Path $archive) {
          Remove-Item $archive -Force
        }

        Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal

    - name: Verify release archive
      run: |
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-${{ matrix.name }}.zip"
        $extractRoot = Join-Path $env:RUNNER_TEMP "release-${{ matrix.name }}"
        cmake "-DARCHIVE_PATH:PATH=$archive" "-DEXTRACT_ROOT:PATH=$extractRoot" "-DBALLANCE_BUILD_STATIC:BOOL=${{ matrix.ballance_build_static }}" -P cmake/VerifyReleaseArchive.cmake

    - name: Upload GitHub release asset
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-${{ matrix.name }}.zip"
        gh release upload $tag $archive --clobber

    - name: Upload staged artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ballance-${{ matrix.name }}-stage
        path: ${{ matrix.stage_path }}
        if-no-files-found: error
        retention-days: 30
