name: Release

on:
  push:
    tags: [ "sdl-v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Check SDL release tag ancestry
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        git fetch origin sdl
        $tagCommit = git rev-list -n 1 "${{ github.ref_name }}"
        git merge-base --is-ancestor $tagCommit origin/sdl
        if ($LASTEXITCODE -ne 0) {
          Write-Error "SDL release tags must point to commits reachable from origin/sdl."
        }

    - name: Create or update draft release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"

        gh release view $tag *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag --title $tag --draft --generate-notes
        }

  package:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdl-windows-x86-runtime
            os: windows-2022
            configure_preset: windows-x86-runtime
            build_preset: windows-x86-runtime-stage-release
            test_dir: build/windows-x86-runtime
            stage_path: build/windows-x86-runtime/stage
            archive_ext: .zip
            ballance_build_static: "OFF"

          - name: sdl-windows-x64-runtime
            os: windows-2022
            configure_preset: windows-x64-runtime
            build_preset: windows-x64-runtime-stage-release
            test_dir: build/windows-x64-runtime
            stage_path: build/windows-x64-runtime/stage
            archive_ext: .zip
            ballance_build_static: "OFF"

          - name: sdl-windows-arm64-runtime
            os: windows-11-arm
            configure_preset: windows-arm64-runtime
            build_preset: windows-arm64-runtime-stage-release
            test_dir: build/windows-arm64-runtime
            stage_path: build/windows-arm64-runtime/stage
            archive_ext: .zip
            ballance_build_static: "OFF"

          - name: sdl-linux-x64-runtime
            os: ubuntu-24.04
            configure_preset: linux-x64-runtime
            build_preset: linux-x64-runtime-stage-release
            test_dir: build/linux-x64-runtime
            stage_path: build/linux-x64-runtime/stage
            archive_ext: .tar.gz
            ballance_build_static: "OFF"

          - name: sdl-linux-arm64-runtime
            os: ubuntu-24.04-arm
            configure_preset: linux-arm64-runtime
            build_preset: linux-arm64-runtime-stage-release
            test_dir: build/linux-arm64-runtime
            stage_path: build/linux-arm64-runtime/stage
            archive_ext: .tar.gz
            ballance_build_static: "OFF"

          - name: sdl-macos-x64-runtime
            os: macos-15-intel
            configure_preset: macos-x64-runtime
            build_preset: macos-x64-runtime-stage-release
            test_dir: build/macos-x64-runtime
            stage_path: build/macos-x64-runtime/stage
            archive_ext: .tar.gz
            ballance_build_static: "OFF"

          - name: sdl-macos-arm64-runtime
            os: macos-15
            configure_preset: macos-arm64-runtime
            build_preset: macos-arm64-runtime-stage-release
            test_dir: build/macos-arm64-runtime
            stage_path: build/macos-arm64-runtime/stage
            archive_ext: .tar.gz
            ballance_build_static: "OFF"

          - name: sdl-windows-x86-static
            os: windows-2022
            configure_preset: windows-x86-static
            build_preset: windows-x86-static-stage-release
            test_dir: build/windows-x86-static
            stage_path: build/windows-x86-static/stage
            archive_ext: .zip
            ballance_build_static: "ON"

          - name: sdl-windows-x64-static
            os: windows-2022
            configure_preset: windows-x64-static
            build_preset: windows-x64-static-stage-release
            test_dir: build/windows-x64-static
            stage_path: build/windows-x64-static/stage
            archive_ext: .zip
            ballance_build_static: "ON"

          - name: sdl-windows-arm64-static
            os: windows-11-arm
            configure_preset: windows-arm64-static
            build_preset: windows-arm64-static-stage-release
            test_dir: build/windows-arm64-static
            stage_path: build/windows-arm64-static/stage
            archive_ext: .zip
            ballance_build_static: "ON"

          - name: sdl-linux-x64-static
            os: ubuntu-24.04
            configure_preset: linux-x64-static
            build_preset: linux-x64-static-stage-release
            test_dir: build/linux-x64-static
            stage_path: build/linux-x64-static/stage
            archive_ext: .tar.gz
            ballance_build_static: "ON"

          - name: sdl-linux-arm64-static
            os: ubuntu-24.04-arm
            configure_preset: linux-arm64-static
            build_preset: linux-arm64-static-stage-release
            test_dir: build/linux-arm64-static
            stage_path: build/linux-arm64-static/stage
            archive_ext: .tar.gz
            ballance_build_static: "ON"

          - name: sdl-macos-x64-static
            os: macos-15-intel
            configure_preset: macos-x64-static
            build_preset: macos-x64-static-stage-release
            test_dir: build/macos-x64-static
            stage_path: build/macos-x64-static/stage
            archive_ext: .tar.gz
            ballance_build_static: "ON"

          - name: sdl-macos-arm64-static
            os: macos-15
            configure_preset: macos-arm64-static
            build_preset: macos-arm64-static-stage-release
            test_dir: build/macos-arm64-static
            stage_path: build/macos-arm64-static/stage
            archive_ext: .tar.gz
            ballance_build_static: "ON"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Setup SDL3
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        install-linux-dependencies: true

    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }} "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}" -DBALLANCE_AUTO_DETECT_ASSETS=OFF -DBALLANCE_ASSETS_ROOT=

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test staged layout
      run: ctest --test-dir ${{ matrix.test_dir }} -C Release --output-on-failure

    - name: Create release archive
      run: |
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-${{ matrix.name }}${{ matrix.archive_ext }}"
        cmake "-DSTAGE_ROOT:PATH=${{ matrix.stage_path }}" "-DARCHIVE_PATH:PATH=$archive" -P cmake/PackageStage.cmake

    - name: Verify release archive
      run: |
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-${{ matrix.name }}${{ matrix.archive_ext }}"
        $extractRoot = Join-Path $env:RUNNER_TEMP "release-${{ matrix.name }}"
        cmake "-DARCHIVE_PATH:PATH=$archive" "-DEXTRACT_ROOT:PATH=$extractRoot" "-DBALLANCE_BUILD_STATIC:BOOL=${{ matrix.ballance_build_static }}" -P cmake/VerifyReleaseArchive.cmake

    - name: Upload GitHub release asset
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-${{ matrix.name }}${{ matrix.archive_ext }}"
        gh release upload $tag $archive --clobber

    - name: Upload package artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7.0.1
      with:
        path: dist/ballance-${{ matrix.name }}${{ matrix.archive_ext }}
        archive: false
        if-no-files-found: error
        retention-days: 30
