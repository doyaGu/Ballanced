name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-win32
            configure_preset: ballance-runtime-msvc-win32
            build_preset: ballance-runtime-win32-stage-release
            test_dir: build/ballance-runtime-msvc-win32
            stage_path: build/ballance-runtime-msvc-win32/stage

          - name: runtime-x64
            configure_preset: ballance-runtime-msvc-x64
            build_preset: ballance-runtime-x64-stage-release
            test_dir: build/ballance-runtime-msvc-x64
            stage_path: build/ballance-runtime-msvc-x64/stage

          - name: static-player-win32
            configure_preset: ballance-static-player-msvc-win32
            build_preset: ballance-static-player-win32-stage-release
            test_dir: build/ballance-static-player-msvc-win32
            stage_path: build/ballance-static-player-msvc-win32/stage

          - name: static-player-x64
            configure_preset: ballance-static-player-msvc-x64
            build_preset: ballance-static-player-x64-stage-release
            test_dir: build/ballance-static-player-msvc-x64
            stage_path: build/ballance-static-player-msvc-x64/stage

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }} -DBALLANCE_AUTO_DETECT_ASSETS=OFF -DBALLANCE_ASSETS_ROOT=

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test staged layout
      run: ctest --test-dir ${{ matrix.test_dir }} -C Release --output-on-failure

    - name: Create release archive
      run: |
        $stage = (Resolve-Path "${{ matrix.stage_path }}").Path
        $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
        New-Item -ItemType Directory -Force $dist | Out-Null

        $archive = Join-Path $dist "ballance-${{ matrix.name }}.zip"
        if (Test-Path $archive) {
          Remove-Item $archive -Force
        }

        Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal

    - name: Upload release archive
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ballance-${{ matrix.name }}
        path: dist/ballance-${{ matrix.name }}.zip
        if-no-files-found: error
        retention-days: 30

  github-release:
    name: Draft GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 15

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Download release archives
      uses: actions/download-artifact@v8.0.0
      with:
        path: dist

    - name: Create or update draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"
        $archives = Get-ChildItem -Path dist -Recurse -Filter *.zip | ForEach-Object { $_.FullName }
        if (-not $archives) {
          throw "No release archives found"
        }

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag @archives --clobber
        } else {
          gh release create $tag @archives --title $tag --draft --generate-notes
        }
