name: Release

on:
  push:
    tags: [ "sdl-v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Check SDL release tag ancestry
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        git fetch origin sdl
        $tagCommit = git rev-list -n 1 "${{ github.ref_name }}"
        git merge-base --is-ancestor $tagCommit origin/sdl
        if ($LASTEXITCODE -ne 0) {
          Write-Error "SDL release tags must point to commits reachable from origin/sdl."
        }

    - name: Create or update draft release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"

        gh release view $tag *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag --title $tag --draft --generate-notes
        }

  package:
    name: sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
    needs: prepare-release
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 150

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86
            os: windows-2022
            archive_ext: .zip
            preset: windows-x86
            sdl_discriminator: Windows-X86
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A Win32

          - name: windows-x64
            os: windows-2022
            archive_ext: .zip
            preset: windows-x64
            sdl_discriminator: Windows-X64
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A x64

          - name: windows-arm64
            os: windows-11-arm
            archive_ext: .zip
            preset: windows-arm64
            sdl_discriminator: Windows-ARM64
            sdl_cmake_generator: Visual Studio 17 2022
            sdl_cmake_arguments: -A ARM64

          - name: linux-x64
            os: ubuntu-24.04
            archive_ext: .tar.gz
            preset: linux-x64
            sdl_discriminator: Linux-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: ""

          - name: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: .tar.gz
            preset: linux-arm64
            sdl_discriminator: Linux-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: ""

          - name: macos-x64
            os: macos-15-intel
            archive_ext: .tar.gz
            preset: macos-x64
            sdl_discriminator: macOS-X64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64

          - name: macos-arm64
            os: macos-15
            archive_ext: .tar.gz
            preset: macos-arm64
            sdl_discriminator: macOS-ARM64
            sdl_cmake_generator: ""
            sdl_cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=arm64
        linkage:
          - name: runtime
            ballance_build_static: "OFF"

          - name: static
            ballance_build_static: "ON"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Setup SDL3
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        cmake-generator: ${{ matrix.platform.sdl_cmake_generator }}
        cmake-arguments: ${{ matrix.platform.sdl_cmake_arguments }}
        discriminator: ${{ matrix.platform.sdl_discriminator }}
        install-linux-dependencies: true

    - name: Configure
      run: cmake --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }} "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}" -DBALLANCE_AUTO_DETECT_ASSETS=OFF -DBALLANCE_ASSETS_ROOT=

    - name: Build
      run: cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-stage-release

    - name: Test staged layout
      run: ctest --test-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }} -C Release --output-on-failure

    - name: Create release archive
      run: |
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        cmake "-DSTAGE_ROOT:PATH=build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}/stage" "-DARCHIVE_PATH:PATH=$archive" -P cmake/PackageStage.cmake

    - name: Verify release archive
      run: |
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        $extractRoot = Join-Path $env:RUNNER_TEMP "release-$target"
        cmake "-DARCHIVE_PATH:PATH=$archive" "-DEXTRACT_ROOT:PATH=$extractRoot" "-DBALLANCE_BUILD_STATIC:BOOL=${{ matrix.linkage.ballance_build_static }}" -P cmake/VerifyReleaseArchive.cmake

    - name: Upload GitHub release asset
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"
        $target = "sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}"
        $archive = Join-Path $env:GITHUB_WORKSPACE "dist/ballance-$target${{ matrix.platform.archive_ext }}"
        gh release upload $tag $archive --clobber

    - name: Upload package artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7.0.1
      with:
        path: dist/ballance-sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}${{ matrix.platform.archive_ext }}
        archive: false
        if-no-files-found: error
        retention-days: 30
